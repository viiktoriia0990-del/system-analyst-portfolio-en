type: object # Short application card for the list
description: An application in the list, without documents and comments. GET /seller-applications/{applicationId} returns them
additionalProperties: false
required:
- id
- sellerId
- status
- legalForm
- legalName
- inn
- createdAt
- updatedAt
properties:
  id:
    type: string
    example: app-501
  sellerId:
    type: string
    example: seller-024
  status:
    $ref: ./application-status.yaml
  legalForm:
    $ref: ./legal-form.yaml
  legalName:
    type: string
    example: IE Anna Viktorovna Smirnova
  inn:
    type: string
    example: '771234567890'
  archivedAt:
    type: string
    format: date-time
    description: When the application was archived. The field is absent if the application is not archived
    example: '2026-10-24T10:05:00Z'
  createdAt:
    type: string
    format: date-time
    example: '2026-10-22T09:10:00Z'
  updatedAt:
    type: string
    format: date-time
    example: '2026-10-22T09:15:00Z'
