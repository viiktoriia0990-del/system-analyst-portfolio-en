type: object # Root type of the application schema
description: Seller verification application
additionalProperties: false # Disallows fields outside properties
required:
- id
- sellerId
- status
- legalForm
- legalName
- inn
- contactEmail
- documents
- createdAt
- updatedAt
properties:
  id:
    type: string
    example: app-501
  sellerId:
    type: string
    example: seller-024
  status:
    $ref: ./application-status.yaml
  legalForm:
    $ref: ./legal-form.yaml
  legalName:
    type: string
    minLength: 3
    maxLength: 255
    example: IE Anna Viktorovna Smirnova
  inn:
    type: string
    pattern: '^(\d{10}|\d{12})$'
    example: '771234567890'
  contactEmail:
    type: string
    format: email
    example: anna.smirnova@example.com
  documents:
    type: array
    description: Attached documents
    items:
      $ref: ./document.yaml
  sellerComment:
    type: string
    description: Seller's comment left at the last submission for review
    maxLength: 1000
    example: Uploaded a fresh EGRIP extract dated 24.10.2026.
  reviewComment:
    type: string
    description: Legal team's comment. Filled in for `REJECTED` and `NEEDS_REWORK`
    maxLength: 2000
    example: The EGRIP record sheet is older than 30 days. Upload a fresh extract.
  archivedAt:
    type: string
    format: date-time
    description: When the application was archived. The field is absent if the application is not archived
    example: '2026-10-24T10:05:00Z'
  createdAt:
    type: string
    format: date-time
    description: When the application was created
    example: '2026-10-22T09:10:00Z'
  updatedAt:
    type: string
    format: date-time
    description: When the application last changed (edit, submission, lawyer's decision, archiving)
    example: '2026-10-23T11:40:00Z'
